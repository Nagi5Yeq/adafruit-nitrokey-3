[workspace]
members = [
    "crates/runner",
    "crates/board-adafruit-nrf52840",
]
default-members = ["crates/board-adafruit-nrf52840"]
resolver = "2"
exclude = ["nk3"]

[workspace.package]
version = "1.9.1"
edition = "2021"
license = "MIT"

[workspace.dependencies]
# NK3 app layer
apps = { path = "nk3/nitrokey-3-firmware/components/apps", features = ["nk3"] }
utils = { path = "nk3/nitrokey-3-firmware/components/utils" }
memory-regions = { path = "nk3/nitrokey-3-firmware/components/memory-regions" }

# Trussed
trussed = { version = "0.2", features = ["default-mechanisms", "p384"] }
trussed-core = "0.2"
trussed-rsa-alloc = { version = "0.5", features = ["raw"] }
interchange = "0.3.3"

# Filesystem
littlefs2 = { version = "=0.8.0", features = ["c-stubs", "unstable-littlefs-patched"] }
littlefs2-sys = { version = "=0.4.0", features = ["tinyrlibc"] }
littlefs2-core = "0.1"

# Protocol dispatchers
apdu-dispatch = "0.4"
ctaphid-dispatch = "0.4"
nfc-device = { path = "nk3/nitrokey-3-firmware/components/nfc-device" }

# Vendor NK3 components (for workspace-level reference)
ndef-app = { path = "nk3/nitrokey-3-firmware/components/ndef-app" }
provisioner-app = { path = "nk3/nitrokey-3-firmware/components/provisioner-app" }
lfs-backup = { path = "nk3/nitrokey-3-firmware/components/lfs-backup" }
fm11nc08 = { path = "nk3/nitrokey-3-firmware/components/fm11nc08" }

# USB
usb-device = "0.3"
usbd-ccid = "0.5"
usbd-ctaphid = "0.5"

# Crypto / RNG
rand = { version = "0.8.5", default-features = false }
rand_chacha = { version = "0.3.1", default-features = false }

# Logging
delog = "0.1"
rtt-target = { version = "0.3", features = ["cortex-m"] }
cortex-m-semihosting = "0.3.5"

# Misc
ref-swap = "0.1.0"
trussed-manage = "0.3.0"
spi-memory = "0.2.0"
generic-array = "0.14"

# Embedded
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.5"
embedded-hal = "0.2.3"
embedded-time = "0.12"
nb = "1"

# Embedded storage
embedded-storage = "0.3"

# RTIC
cortex-m-rtic = "1.0"

# NRF52
nrf52840-hal = "0.18"
nrf52840-pac = "0.12"

# Our crates
runner = { path = "crates/runner" }

# ============================================================================
# Patch — redirect ALL crate registry deps to vendored local copies
# ============================================================================

[patch.crates-io]
# --- nk3 workspace components ---
memory-regions = { path = "nk3/nitrokey-3-firmware/components/memory-regions" }
apps = { path = "nk3/nitrokey-3-firmware/components/apps" }
utils = { path = "nk3/nitrokey-3-firmware/components/utils" }
nfc-device = { path = "nk3/nitrokey-3-firmware/components/nfc-device" }
ndef-app = { path = "nk3/nitrokey-3-firmware/components/ndef-app" }
provisioner-app = { path = "nk3/nitrokey-3-firmware/components/provisioner-app" }

# --- vendored application crates ---
admin-app = { path = "nk3/admin-app" }
opcard = { path = "nk3/opcard-rs" }
piv-authenticator = { path = "nk3/piv-authenticator" }
secrets-app = { path = "nk3/trussed-secrets-app" }
fido-authenticator = { path = "nk3/fido-authenticator" }
cosey = { path = "nk3/cosey" }
ctap-types = { path = "nk3/ctap-types" }

# --- vendored trussed-auth ---
trussed-auth = { path = "nk3/trussed-auth/extension" }
trussed-auth-backend = { path = "nk3/trussed-auth/backend" }

# --- vendored trussed-rsa-backend ---
trussed-rsa-alloc = { path = "nk3/trussed-rsa-backend" }
trussed-rsa-types = { path = "nk3/trussed-rsa-backend/types" }

# --- vendored trussed-staging ---
trussed-staging = { path = "nk3/trussed-staging" }
trussed-chunked = { path = "nk3/trussed-staging/extensions/chunked" }
trussed-hkdf = { path = "nk3/trussed-staging/extensions/hkdf" }
trussed-hpke = { path = "nk3/trussed-staging/extensions/hpke" }
trussed-manage = { path = "nk3/trussed-staging/extensions/manage" }
trussed-wrap-key-to-file = { path = "nk3/trussed-staging/extensions/wrap-key-to-file" }
trussed-fs-info = { path = "nk3/trussed-staging/extensions/fs-info" }

# --- trussed core ---
trussed = { path = "nk3/trussed" }
trussed-core = { path = "nk3/trussed/core" }

# --- unreleased libraries pinned by nitrokey-3-firmware ---
p256-cortex-m4 = { git = "https://github.com/ycrypto/p256-cortex-m4.git", rev = "cdb31e12594b4dc1f045b860a885fdc94d96aee2" }

# ============================================================================
# Release profile
# ============================================================================

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "z"
incremental = false
debug = true

[profile.release-thin-lto]
lto = "thin"
inherits = "release"

[profile.release.package.salty]
opt-level = 2

[profile.release-thin-lto.package.salty]
opt-level = 2
