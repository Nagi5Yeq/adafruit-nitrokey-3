[package]
name = "adafruit-nk3"
version = "0.1.0"
edition = "2021"

# ============================================================================
# Dependencies — mirrors runners/embedded (embedded-runner-lib) for NK3AM
# ============================================================================

[dependencies]
### base dependencies (from embedded runner)
apps = { path = "nk3/nitrokey-3-firmware/components/apps", features = ["nk3"] }
boards = { path = "nk3/nitrokey-3-firmware/components/boards", features = ["trussed-auth", "board-nk3am"] }
delog = "0.1"
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.5"
cortex-m-rtic = "1.0"
embedded-hal = "0.2.3"
littlefs2 = { version = "0.7.0", features = ["c-stubs", "unstable-littlefs-patched"] }
littlefs2-core = "0.1"
nfc-device = { path = "nk3/nitrokey-3-firmware/components/nfc-device" }
utils = { path = "nk3/nitrokey-3-firmware/components/utils", features = ["storage"] }

### protocols and dispatchers
apdu-dispatch = "0.4"

### trussed core
trussed = { version = "0.1", features = ["default-mechanisms", "p384", "p521"] }
interchange = "0.3"

### usb machinery
usb-device = "0.2"

### NRF52 specific dependencies
nrf52840-hal = { version = "0.15.1", optional = true }
nrf52840-pac = { version = "0.11", optional = true }

### LPC55 specific dependencies
lpc55-hal = { version = "0.5", optional = true }
lpc55-pac = { version = "0.5", optional = true }
nb = { version = "1", optional = true }
systick-monotonic = { version = "1.0.0", optional = true }

### Allocator
embedded-alloc = { version = "0.6.0", optional = true }

### SE050 — kept as dependency; feature-gated via boards/apps
se05x = { version = "0.4", optional = true }

# littlefs2-sys for intrinsics feature
littlefs2-sys = { version = "0.3", optional = true }

[build-dependencies]
utils = { path = "nk3/nitrokey-3-firmware/components/utils", features = ["build"] }

# ============================================================================
# Features
# ============================================================================

[features]
default = ["alloc", "log-rtt", "log-all", "log-debugP", "board-adafruit"]

alloc = ["embedded-alloc"]

# board selection
board-adafruit = ["boards/board-nk3am", "soc-nrf52"]

# SoC selection
soc-nrf52 = ["nrf52840-hal", "nrf52840-pac"]
soc-lpc55 = ["lpc55-hal", "lpc55-pac", "nb", "systick-monotonic"]

se050 = ["apps/se050", "boards/se050", "dep:se05x"]

# build variants
test = ["apps/nk3-test", "utils/test"]
develop = ["no-encrypted-storage", "apps/no-reset-time-window", "log-traceP"]
develop-no-press = ["develop", "no-buttons"]
provisioner = ["apps/nk3-provisioner", "boards/provisioner", "write-undefined-flash", "no-buttons", "apps/no-reset-time-window", "lpc55-hardware-checks"]

# delog control
no-delog = ["boards/no-delog", "delog/knock-it-off"]

# Disable littlefs use of compiler intrinsics
littlefs-software-intrinsics = ["littlefs2-sys/software-intrinsics"]

# Do not use encryption for the filesystem
no-encrypted-storage = ["boards/no-encrypted-storage"]

# Check for undefined flash and write to determined value (for prince provisioning)
write-undefined-flash = []

# Use to auto-succeed every user presence check
no-buttons = ["boards/no-buttons"]

# Format filesystem anyway
format-filesystem = ["boards/format-filesystem"]

lpc55-hardware-checks = []

# factory reset
factory-reset = ["apps/factory-reset"]

# logging levels
log-all = ["boards/log-all"]
log-trace = []
log-debug = []
log-info = []
log-warn = []
log-error = ["boards/log-error"]
log-none = []

log-traceP = ["log-trace", "log-debug", "log-info", "log-warn", "log-error"]
log-debugP = ["log-debug", "log-info", "log-warn", "log-error"]
log-infoP = ["log-info", "log-warn", "log-error"]
log-warnP = ["log-warn", "log-error"]

# logging transport
log-rtt = ["boards/log-rtt"]
log-semihosting = ["boards/log-semihosting"]

# ============================================================================
# Patch — redirect ALL crate registry deps to vendored local copies
# ============================================================================

[patch.crates-io]
# --- nk3 workspace components (path into nk3/nk3) ---
memory-regions = { path = "nk3/nitrokey-3-firmware/components/memory-regions" }
apps = { path = "nk3/nitrokey-3-firmware/components/apps" }
boards = { path = "nk3/nitrokey-3-firmware/components/boards" }
utils = { path = "nk3/nitrokey-3-firmware/components/utils" }
nfc-device = { path = "nk3/nitrokey-3-firmware/components/nfc-device" }
ndef-app = { path = "nk3/nitrokey-3-firmware/components/ndef-app" }
provisioner-app = { path = "nk3/nitrokey-3-firmware/components/provisioner-app" }
lfs-backup = { path = "nk3/nitrokey-3-firmware/components/lfs-backup" }
fm11nc08 = { path = "nk3/nitrokey-3-firmware/components/fm11nc08" }

# --- vendored application crates ---
admin-app = { path = "nk3/admin-app" }
opcard = { path = "nk3/opcard-rs" }
piv-authenticator = { path = "nk3/piv-authenticator" }
secrets-app = { path = "nk3/trussed-secrets-app" }
encrypted_container = { path = "nk3/trussed-secrets-app/components/encrypted_container" }

# --- vendored trussed-auth (workspace with backend + extension) ---
trussed-auth = { path = "nk3/trussed-auth/extension" }
trussed-auth-backend = { path = "nk3/trussed-auth/backend" }

# --- vendored trussed-rsa-backend (workspace with types) ---
trussed-rsa-alloc = { path = "nk3/trussed-rsa-backend" }
trussed-rsa-types = { path = "nk3/trussed-rsa-backend/types" }

# --- vendored trussed-staging (workspace with extensions) ---
trussed-staging = { path = "nk3/trussed-staging" }
trussed-chunked = { path = "nk3/trussed-staging/extensions/chunked" }
trussed-hkdf = { path = "nk3/trussed-staging/extensions/hkdf" }
trussed-hpke = { path = "nk3/trussed-staging/extensions/hpke" }
trussed-manage = { path = "nk3/trussed-staging/extensions/manage" }
trussed-wrap-key-to-file = { path = "nk3/trussed-staging/extensions/wrap-key-to-file" }
trussed-fs-info = { path = "nk3/trussed-staging/extensions/fs-info" }


trussed = { path = "nk3/trussed" }
trussed-core = { path = "nk3/trussed/core" }
trussed-se050-backend = { path = "nk3/trussed-se050-backend" }

# ============================================================================
# Release profile — match upstream nk3
# ============================================================================

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "z"
incremental = false
debug = true

[profile.release-thin-lto]
lto = "thin"
inherits = "release"

[profile.release.package.salty]
opt-level = 2

[profile.release-thin-lto.package.salty]
opt-level = 2
