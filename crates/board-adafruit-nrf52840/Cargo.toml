[package]
name = "board-adafruit-nrf52840"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
runner = { workspace = true }
adafruit-memory-layout = { path = "memory-layout" }
apps = { workspace = true }
utils = { workspace = true, features = ["storage"] }
trussed = { workspace = true }
trussed-core = { workspace = true }
trussed-rsa-alloc = { workspace = true }
interchange = { workspace = true }
apdu-dispatch = { workspace = true }
usb-device = { workspace = true }
usbd-ccid = { workspace = true }
usbd-ctaphid = { workspace = true }
cortex-m = { workspace = true }
cortex-m-rt = { workspace = true }
cortex-m-rtic = { workspace = true }
embedded-hal = { workspace = true }
embedded-storage = { workspace = true }
embedded-time = { workspace = true }
delog = { workspace = true }
nfc-device = { workspace = true }
littlefs2 = { workspace = true }
littlefs2-sys = { workspace = true }
generic-array = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
nrf52840-hal = { workspace = true }
nrf52840-pac = { workspace = true }
embedded-alloc = { version = "0.6.0", optional = true }
rtt-target = { workspace = true, optional = true }

[build-dependencies]
adafruit-memory-layout = { path = "../board-adafruit-nrf52840/memory-layout" }
utils = { workspace = true, features = ["build"] }

[features]
default = ["alloc", "log-rtt", "log-all", "log-debugP"]
alloc = ["embedded-alloc"]
no-delog = ["runner/no-delog", "delog/knock-it-off"]
log-all = ["runner/log-all", "apps/log-all"]
log-trace = []
log-debug = []
log-info = []
log-warn = []
log-error = ["runner/log-error"]
log-none = []
log-traceP = ["log-trace", "log-debug", "log-info", "log-warn", "log-error"]
log-debugP = ["log-debug", "log-info", "log-warn", "log-error"]
log-infoP = ["log-info", "log-warn", "log-error"]
log-warnP = ["log-warn", "log-error"]
log-rtt = ["runner/log-rtt", "rtt-target"]
log-semihosting = ["runner/log-semihosting"]
test = ["apps/nk3-test", "utils/test"]
no-buttons = ["runner/no-buttons"]
no-encrypted-storage = ["runner/no-encrypted-storage"]
format-filesystem = ["runner/format-filesystem"]
factory-reset = ["apps/factory-reset"]
